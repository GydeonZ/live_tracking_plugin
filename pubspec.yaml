name: live_tracking_plugin
description: "A comprehensive live tracking package for Flutter with offline support, high accuracy GPS tracking, and real-time synchronization. Compatible with iOS and Android."
version: 0.1.0
homepage: https://github.com/GydeonZ/live_tracking_plugin
repository: https://github.com/GydeonZ/live_tracking_plugin
issue_tracker: https://github.com/GydeonZ/live_tracking_plugin/issues

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  
  # Location & GPS
  geolocator: ^11.0.0
  location: ^5.0.0
  
  # Map & Visualization (OpenStreetMap)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  
  # Database & Storage
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  
  # Networking & Serialization
  http: ^1.1.0
  dio: ^5.3.0
  json_annotation: ^4.8.1
  
  # State Management
  get: ^4.6.5
  
  # Utils
  intl: ^0.20.0
  uuid: ^4.0.0
  permission_handler: ^11.0.0
  connectivity_plus: ^6.0.0
  flutter_foreground_task: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  plugin:
    platforms:
      android:
        package: com.example.live_tracking_plugin
        pluginClass: LiveTrackingPlugin
      ios:
        pluginClass: LiveTrackingPlugin
